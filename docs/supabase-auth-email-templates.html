<!--
  Supabase Auth email templates (Dashboard → Authentication → Email Templates)
  Copy each block into the matching template. Variables use Go template syntax.

  Reset password / Magic link / Invite / Confirm signup share the same VexMy look.
-->

<!-- SUBJECT examples (edit in Supabase UI, not in HTML body):
  Reset: Reset your VexMy password
  Magic link: Your VexMy sign-in link
  Invite: You are invited to VexMy
  Confirm: Confirm your VexMy account
-->

<!doctype html>
<html lang="en">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/></head>
<body style="margin:0;padding:0;background:#090a0f;">
  <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="background:#090a0f;font-family:Arial,Helvetica,sans-serif;">
    <tr>
      <td align="center" style="padding:24px 12px;">
        <table role="presentation" cellpadding="0" cellspacing="0" width="600" style="width:100%;max-width:600px;border:1px solid #2a2a2e;border-radius:14px;background:#121216;overflow:hidden;">
          <tr>
            <td align="center" style="padding:22px 24px;background:linear-gradient(180deg,#1a1a1f,#101014);border-bottom:1px solid #2a2a2e;">
              <p style="margin:0;font-size:28px;font-weight:900;letter-spacing:.8px;color:#d4af37;">VEXMY</p>
              <p style="margin:8px 0 0;font-size:11px;letter-spacing:.35px;color:#c7c7c7;text-transform:uppercase;">Account</p>
            </td>
          </tr>
          <tr>
            <td style="padding:24px 26px;">
              <h1 style="margin:0 0 10px;font-size:24px;line-height:1.25;color:#d4af37;font-weight:800;">Reset your password</h1>
              <p style="margin:0 0 12px;font-size:15px;color:#d7d7d7;">Hi there,</p>
              <p style="margin:0 0 16px;font-size:14px;line-height:1.65;color:#d7d7d7;">We received a request to reset your VexMy password. Use the button below to choose a new one.</p>
              <table role="presentation" cellpadding="0" cellspacing="0" align="center" style="margin:20px auto;">
                <tr>
                  <td align="center" bgcolor="#d4af37" style="border-radius:999px;background-color:#d4af37;">
                    <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 28px;font-size:14px;font-weight:800;color:#1a1a1a;text-decoration:none;border-radius:999px;">Reset password</a>
                  </td>
                </tr>
              </table>
              <p style="margin:8px 0 0;font-size:12px;color:#9f9f9f;word-break:break-all;text-align:center;">If the button does not work: <a href="{{ .ConfirmationURL }}" style="color:#d4af37;">{{ .ConfirmationURL }}</a></p>
              <p style="margin:16px 0 0;font-size:12px;color:#9f9f9f;">If you did not request this, you can ignore this email.</p>
              <p style="margin:14px 0 0;font-size:12px;color:#9f9f9f;">Questions? <a href="mailto:no-reply@vexmy.com" style="color:#d4af37;">no-reply@vexmy.com</a></p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
