[auth]
site_url = "https://velbok.com"
additional_redirect_urls = [
  "https://velbok.com/**",
  "https://velbok.com/auth/app-callback",
  "com.velbok.app://auth/callback",
  "http://localhost:5173/**",
  "http://localhost:8080/**",
]

# TOTP MFA only (no Advanced Phone MFA add-on)
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

[auth.sms.twilio]
enabled = false

[auth.hook.send_sms]
enabled = false

