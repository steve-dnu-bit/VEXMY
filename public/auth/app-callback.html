<!DOCTYPE html>
<html lang="en" translate="no">
  <head>
    <meta charset="utf-8" />
    <meta name="google" content="notranslate" />
    <meta http-equiv="Content-Language" content="en" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Velbok</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #090a0f;
        color: #a1a1aa;
        font-family: system-ui, sans-serif;
        font-size: 14px;
        text-align: center;
        padding: 24px;
      }
      a {
        color: #0c0c0f;
        background: #d4af37;
        text-decoration: none;
        display: inline-block;
        padding: 14px 22px;
        border-radius: 10px;
        font-weight: 600;
      }
      #msg {
        margin-bottom: 16px;
      }
    </style>
  </head>
  <body translate="no">
    <div>
      <p id="msg">Returning to Velbok…</p>
      <p id="fallback" hidden>
        <a id="openApp" href="#">Open Velbok app</a>
      </p>
    </div>
    <script>
      (function () {
        var PACKAGE = "com.velbok.app";
        var SCHEME = "com.velbok.app";
        var msg = document.getElementById("msg");
        var fallback = document.getElementById("fallback");
        var openApp = document.getElementById("openApp");

        function collectParams() {
          var merged = new URLSearchParams();
          try {
            var fromSearch = new URLSearchParams(window.location.search || "");
            fromSearch.forEach(function (value, key) {
              merged.set(key, value);
            });
          } catch (e) {}
          try {
            var hash = (window.location.hash || "").replace(/^#/, "");
            if (hash) {
              var fromHash = new URLSearchParams(hash);
              fromHash.forEach(function (value, key) {
                merged.set(key, value);
              });
            }
          } catch (e) {}
          return merged;
        }

        var params = collectParams();
        if (![...params.keys()].length) {
          msg.textContent =
            "Sign-in callback is missing parameters. Close this tab and try again in the app.";
          return;
        }

        // Put tokens in the query string — iOS often drops URL fragments on custom-scheme handoff.
        var query = "?" + params.toString();
        var customScheme = SCHEME + "://auth/callback" + query;
        var ua = navigator.userAgent;
        var isAndroid = /Android/i.test(ua);
        var isIos = /iPhone|iPad|iPod/i.test(ua);

        // Desktop / laptop browsers: no app to open — finish on the website instead.
        if (!isAndroid && !isIos) {
          params.delete("redirect_to");
          window.location.replace("/auth?" + params.toString());
          return;
        }

        var intentUrl =
          "intent://auth/callback" +
          query +
          "#Intent;scheme=" +
          SCHEME +
          ";package=" +
          PACKAGE +
          ";end";

        function showFallback(href) {
          openApp.href = href;
          fallback.hidden = false;
          msg.textContent = "Tap below to finish sign-in in the Velbok app.";
        }

        // Show the button immediately — Mail in-app browsers often block auto custom-scheme opens.
        showFallback(customScheme);

        if (isAndroid) {
          window.location.replace(intentUrl);
        } else {
          window.location.replace(customScheme);
        }
      })();
    </script>
  </body>
</html>
