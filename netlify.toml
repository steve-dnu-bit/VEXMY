[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Allow studios to embed customer login on their own websites
[[headers]]
  for = "/embed/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors *"

# Geo IP endpoint (Netlify Edge) — must run before SPA fallback
[[edge_functions]]
  path = "/api/geo-country"
  function = "geo-country"

# SPA client-side routing (React Router) — exclude edge API routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Manual deploy workflow: disable auto-builds in Netlify UI to save credits.
# See docs/deploy-workflow.md — use npm run deploy:preview / deploy:prod
