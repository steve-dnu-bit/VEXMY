[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), payment=(self), identity-credentials-get=(self)"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: blob: https: https://*.googleusercontent.com; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.stripe.com https://*.stripe.com https://accounts.google.com https://oauth2.googleapis.com; frame-src 'self' https://js.stripe.com https://hooks.stripe.com https://checkout.stripe.com https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'"

[build.environment]
  NODE_VERSION = "20"
  VITE_GOOGLE_CLIENT_ID = "843973604535-hh4010q2pagr6m72esbh9mlddattg65i.apps.googleusercontent.com"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/downloads/android-version.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/downloads/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/downloads/*.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=\"velbok-android.apk\""
    Cache-Control = "no-cache, no-store, must-revalidate"

# Allow studios to embed customer login on their own websites
[[headers]]
  for = "/embed/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors *"

# Geo IP endpoint (Netlify Edge) — must run before SPA fallback
[[edge_functions]]
  path = "/api/geo-country"
  function = "geo-country"

# Native OAuth: forward auth code to app deep link (no React / no PKCE exchange in browser)
[[redirects]]
  from = "/auth/app-callback"
  to = "/auth/app-callback.html"
  status = 200

[[headers]]
  for = "/auth/app-callback.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type = "text/html; charset=utf-8"
    Content-Language = "en"
    X-Robots-Tag = "noindex"

# SPA client-side routing (React Router) — exclude edge API routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Manual deploy workflow: disable auto-builds in Netlify UI to save credits.
# See docs/deploy-workflow.md — use npm run deploy:preview / deploy:prod
