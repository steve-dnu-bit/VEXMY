[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA client-side routing (React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Manual deploy workflow: disable auto-builds in Netlify UI to save credits.
# See docs/deploy-workflow.md — use npm run deploy:preview / deploy:prod
